<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="webstyle.css">
    </head>
    <body>
        <div class="container">
            <div class="symbol-bg"></div>
            <div class="polka-bg"></div>
        </div>
        <div>
            <img src="mathlogo.png" style="display: block; margin-left: auto; margin-right: auto; width: 25%; height: 25%">
        </div>
        <div class="content">
            <h1>Hello!</h1>
            <nav class="crumbs">
                <ol>
                    <li class="crumb"><a href="#">hi</a></li>
                    <li class="crumb"><a href="#">it's</a></li>
                    <li class="crumb">me</li>
                </ol>
            </nav>
            <br>
            <button style="align-self: center;" onclick="toggleWindow()"><b>Lesson Summary</b></button>
        </div>

        <div id="Toggle">
            <h1>Hello!</h1>
            <nav class="crumbs">
                <ol>
                    <li class="crumb"><a href="#">hi</a></li>
                    <li class="crumb"><a href="#">it's</a></li>
                    <li class="crumb">me</li>
                </ol>
            </nav>
            <br>
        </div>

        <script>
            function toggleWindow() {
                var x = document.getElementById("Toggle");
                if (x.style.display === "block") {
                    x.style.display = "none";
                } else {
                    x.style.display = "block";
                }
            }
        </script>
    </body>
</html>
